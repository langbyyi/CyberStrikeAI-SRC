name: searchsploit
command: searchsploit
enabled: true
short_description: ExploitDB 漏洞利用数据库检索
description: '在本地 ExploitDB 数据库中搜索已知漏洞利用代码。

  **使用场景：** 软件版本→已知 exploit 关联、漏洞利用参考。


  **安装：** `apt install exploitdb`（若不可用先安装）。'
parameters:
  - name: query
    type: string
    required: true
    position: 0
    format: positional
    description: 搜索关键词（单个词或无空格词组，如 `tomcat` `struts2`）；多关键词 AND 检索用 additional_args 追加
  - name: additional_args
    type: string
    required: false
    format: positional
    description: '空格分隔的附加参数：追加关键词即 AND 检索，如 query=`tomcat` 时传 `8.0`；

      选项如 `-x <id>`(查看 exploit 详情) `-j`(JSON 输出) `--exclude dos`(排除类别)'
