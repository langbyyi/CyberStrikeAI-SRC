name: proxychains
command: proxychains
enabled: true
short_description: 强制应用流量走代理（内网穿透）
description: '通过代理链强制任意程序流量走 SOCKS 代理。

  **使用场景：** 内网渗透中通过代理访问内网服务。


  **安装：** `apt install proxychains4`（若不可用先安装）。'
parameters:
  - name: command
    type: string
    required: true
    position: 0
    format: positional
    description: 要代理执行的命令，如 `nmap -sT -Pn 10.0.0.1`（自动前置 proxychains）
  - name: config
    type: string
    required: false
    flag: -f
    format: flag
    description: 指定配置文件
