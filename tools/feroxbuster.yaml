name: "feroxbuster"
command: "feroxbuster"
enabled: true
short_description: "递归 Web 内容/目录发现工具，快速多线程枚举隐藏路径"
description: |
  Feroxbuster 是快速、简单的递归内容发现工具。

  **主要功能：**
  - 递归目录/文件发现
  - 多线程扫描（默认 10 线程）
  - 状态码过滤（200/301/403/500）
  - 支持扩展名枚举、代理、重试

  **使用场景：**
  - Web 目录/文件枚举
  - 隐藏路径发现
  - 递归内容映射

  **注意事项：**
  - 需要有效的 `url`（必填）
  - `wordlist` 默认用 dirb 常见字典；自定义字典更全
  - 建议加 `additional_args`：`--filter-status 404` 过滤噪音、`-x php,html,js` 指定扩展名
  - 控制 `threads` 避免触发 WAF/封禁（默认 10）
parameters:
  - name: "url"
    type: "string"
    description: |
      目标 URL。示例：`https://example.com/`、`http://192.168.1.1/dir/`
    required: true
    flag: "-u"
    format: "flag"
  - name: "wordlist"
    type: "string"
    description: |
      字典文件路径。默认 `/usr/share/wordlists/dirb/common.txt`。示例：`/usr/share/wordlists/dirbuster/directory-list-2.3-medium.txt`
    required: false
    flag: "-w"
    format: "flag"
    default: "/usr/share/wordlists/dirb/common.txt"
  - name: "threads"
    type: "int"
    description: "线程数（默认 10，越大越快但易触发防护）。示例：`50`"
    required: false
    flag: "-t"
    format: "flag"
    default: 10
  - name: "extensions"
    type: "string"
    description: |
      附加扫描的扩展名，逗号分隔传给 `-x`。示例：`php,html,js,bak`
    required: false
    flag: "-x"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: |
      额外参数追加到命令末尾。常用：
      - `--filter-status 404`（过滤 404 减少噪音）
      - `--silent`（仅输出结果）
      - `-r`（递归扫描）
      - `-k`（忽略证书校验）
    required: false
    format: "positional"
