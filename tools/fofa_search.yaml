name: "fofa_search"
command: "python3"
args:
  - "-c"
  - |
    import sys
    import json
    import base64
    import os
    import re
    import ssl
    from urllib.parse import urlparse, urlunparse

    try:
        import requests
        from requests.adapters import HTTPAdapter
        from urllib3.util.retry import Retry
        import urllib3
    except Exception as e:
        print(json.dumps({"status": "error", "message": f"缺少依赖 requests/urllib3: {e}"}, ensure_ascii=False, indent=2))
        sys.exit(1)

    urllib3.disable_warnings(urllib3.exceptions.InsecureRequestWarning)

    # ==================== FOFA 配置获取 ====================
    # 优先级：环境变量 > config.yaml > 默认值
    FOFA_EMAIL_DEFAULT = ""
    FOFA_API_KEY_DEFAULT = ""
    FOFA_BASE_URL_DEFAULT = ""  # 留空默认 https://fofa.info/api/v1/search/all
    FOFA_BEARER_TOKEN_DEFAULT = ""
    FOFA_AUTH_MODE_DEFAULT = "auto"  # auto | key | bearer
    OFFICIAL_HOSTS = ("fofa.info", "api.fofa.info")

    def read_config_yaml():
        """从工作目录的 config.yaml 读取 fofa 段（无需 PyYAML 依赖）"""
        result = {}
        for path in ('config.yaml', '../config.yaml', '../../config.yaml'):
            try:
                with open(path, 'r', encoding='utf-8') as f:
                    content = f.read()
                m = re.search(r'^fofa:\s*\n((?:[ \t]+.+\n?)*)', content, re.MULTILINE)
                if not m:
                    continue
                block = m.group(1)
                # 简单键值
                for line in block.split('\n'):
                    raw = line.rstrip()
                    if not raw.strip() or raw.strip().startswith('#'):
                        continue
                    # list item under fallback_base_urls
                    if re.match(r'^[ \t]+-\s+', raw):
                        if '_list_key' in result:
                            val = re.sub(r'^[ \t]+-\s+', '', raw).split('#')[0].strip().strip('"\'')
                            if val:
                                result.setdefault(result['_list_key'], [])
                                if not isinstance(result[result['_list_key']], list):
                                    result[result['_list_key']] = []
                                result[result['_list_key']].append(val)
                        continue
                    if ':' not in raw:
                        continue
                    # only first-level keys under fofa (2-4 spaces typical)
                    if not re.match(r'^[ \t]{1,4}\w', raw):
                        continue
                    key, _, val = raw.strip().partition(':')
                    key = key.strip()
                    val = val.split('#')[0].strip().strip('"\'')
                    if val == '':
                        # possible start of list
                        result['_list_key'] = key
                        result.setdefault(key, [])
                        continue
                    result.pop('_list_key', None)
                    if val.lower() in ('true', 'false'):
                        result[key] = val.lower() == 'true'
                    else:
                        result[key] = val
                result.pop('_list_key', None)
                if result:
                    return result
            except Exception:
                continue
        return result

    def env_bool(name, default=None):
        v = os.getenv(name, '').strip().lower()
        if v in ('1', 'true', 'yes', 'on'):
            return True
        if v in ('0', 'false', 'no', 'off'):
            return False
        return default

    def parse_fallback_list(raw):
        if raw is None:
            return []
        if isinstance(raw, list):
            return [str(x).strip() for x in raw if str(x).strip()]
        s = str(raw).strip()
        if not s:
            return []
        parts = re.split(r'[\n,;]+', s)
        return [p.strip() for p in parts if p.strip()]

    _cfg = read_config_yaml()
    email = (
        os.getenv('FOFA_EMAIL', '').strip()
        or str(_cfg.get('email', '') or '').strip()
        or FOFA_EMAIL_DEFAULT
    )
    api_key = (
        os.getenv('FOFA_API_KEY', '').strip()
        or str(_cfg.get('api_key', '') or '').strip()
        or FOFA_API_KEY_DEFAULT
    )
    base_url = (
        os.getenv('FOFA_BASE_URL', '').strip()
        or str(_cfg.get('base_url', '') or '').strip()
        or FOFA_BASE_URL_DEFAULT
        or "https://fofa.info/api/v1/search/all"
    )
    bearer_token = (
        os.getenv('FOFA_BEARER_TOKEN', '').strip()
        or str(_cfg.get('bearer_token', '') or '').strip()
        or FOFA_BEARER_TOKEN_DEFAULT
    )
    auth_mode = (
        os.getenv('FOFA_AUTH_MODE', '').strip()
        or str(_cfg.get('auth_mode', '') or '').strip()
        or FOFA_AUTH_MODE_DEFAULT
    ).lower()
    if auth_mode not in ('auto', 'key', 'bearer'):
        auth_mode = 'auto'

    verify_ssl_cfg = env_bool('FOFA_VERIFY_SSL', None)
    if verify_ssl_cfg is None and 'verify_ssl' in _cfg:
        v = _cfg.get('verify_ssl')
        if isinstance(v, bool):
            verify_ssl_cfg = v
        elif str(v).strip().lower() in ('true', 'false'):
            verify_ssl_cfg = str(v).strip().lower() == 'true'

    try:
        timeout_sec = int(os.getenv('FOFA_TIMEOUT_SECONDS', '').strip() or _cfg.get('timeout_seconds') or 30)
    except Exception:
        timeout_sec = 30
    if timeout_sec <= 0:
        timeout_sec = 30

    fallback_urls = parse_fallback_list(os.getenv('FOFA_FALLBACK_BASE_URLS', '') or _cfg.get('fallback_base_urls'))

    def is_official(url):
        try:
            host = (urlparse(url).hostname or '').lower()
        except Exception:
            host = ''
        return any(host == h or host.endswith('.' + h) for h in OFFICIAL_HOSTS)

    def is_proxy_endpoint(url):
        return not is_official(url)

    def http_variant(url):
        try:
            p = urlparse(url)
            if p.scheme == 'https':
                return urlunparse(('http', p.netloc, p.path, p.params, p.query, p.fragment))
        except Exception:
            pass
        return None

    def build_candidate_urls(primary, fallbacks):
        out = []
        seen = set()
        def add(u):
            u = (u or '').strip()
            if not u or u in seen:
                return
            seen.add(u)
            out.append(u)
        add(primary)
        for u in fallbacks:
            add(u)
            # 若用户只写了 host:port，补全标准 path
            if '://' in u and '/api/' not in u.rstrip('/'):
                add(u.rstrip('/') + '/api/v1/search/all')
            if re.match(r'^[\d\.]+:\d+$', u):
                add('http://' + u + '/api/v1/search/all')
                add('https://' + u + '/api/v1/search/all')
        # 代理 HTTPS 失败时常见可走 HTTP（部分镜像支持）
        extras = []
        for u in list(out):
            if is_proxy_endpoint(u):
                hv = http_variant(u)
                if hv:
                    extras.append(hv)
        for u in extras:
            add(u)
        return out

    def make_session(verify):
        s = requests.Session()
        s.verify = verify
        retry = Retry(total=2, connect=2, read=1, backoff_factor=0.4,
                      status_forcelist=(502, 503, 504),
                      allowed_methods=frozenset(['GET']))
        adapter = HTTPAdapter(max_retries=retry, pool_connections=4, pool_maxsize=4)
        s.mount('https://', adapter)
        s.mount('http://', adapter)
        return s

    def default_headers(url, use_bearer):
        h = {
            'Accept': 'application/json, text/plain, */*',
            'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
            'User-Agent': 'Mozilla/5.0 (compatible; CyberStrikeAI-FOFA/1.6; +local)',
        }
        try:
            p = urlparse(url)
            if p.scheme and p.netloc:
                origin = f"{p.scheme}://{p.netloc}"
                h['Referer'] = origin + '/'
                h['Origin'] = origin
        except Exception:
            pass
        return h

    def parse_args():
        if len(sys.argv) > 1:
            try:
                arg1 = str(sys.argv[1])
                config = json.loads(arg1)
                if isinstance(config, dict):
                    return config
            except (json.JSONDecodeError, TypeError, ValueError):
                pass
        config = {}
        if len(sys.argv) > 1:
            config['query'] = str(sys.argv[1])
        if len(sys.argv) > 2:
            try:
                config['size'] = int(sys.argv[2])
            except (ValueError, TypeError):
                pass
        if len(sys.argv) > 3:
            try:
                config['page'] = int(sys.argv[3])
            except (ValueError, TypeError):
                pass
        if len(sys.argv) > 4:
            config['fields'] = str(sys.argv[4])
        if len(sys.argv) > 5:
            val = sys.argv[5]
            if isinstance(val, str):
                config['full'] = val.lower() in ('true', '1', 'yes')
            else:
                config['full'] = bool(val)
        return config

    def auth_modes_to_try():
        if auth_mode == 'key':
            return ['key']
        if auth_mode == 'bearer':
            return ['bearer']
        # auto
        modes = ['key']
        if bearer_token:
            modes.append('bearer')
        return modes

    def verify_modes_for(url):
        if verify_ssl_cfg is True:
            return [True]
        if verify_ssl_cfg is False:
            return [False]
        # auto: 官方先验真；代理先尝试真，TLS 失败再 false（由外层循环处理）
        if is_official(url):
            return [True]
        return [True, False]

    try:
        config = parse_args()
        if not isinstance(config, dict):
            print(json.dumps({
                "status": "error",
                "message": f"参数解析错误: 期望字典类型，但得到 {type(config).__name__}",
                "type": "TypeError"
            }, ensure_ascii=False, indent=2))
            sys.exit(1)

        query = str(config.get('query', '') or '').strip()
        if not api_key and not bearer_token:
            print(json.dumps({
                "status": "error",
                "message": "缺少FOFA配置: api_key 或 bearer_token",
                "required_config": ["api_key"],
                "note": "请在 config.yaml 的 fofa 段配置 api_key，或设置环境变量 FOFA_API_KEY。\n官方需 email+api_key；兼容代理只需 api_key 并将 base_url 指向其 search 接口。\nTLS 异常可设 verify_ssl: false；可配 fallback_base_urls / bearer_token。"
            }, ensure_ascii=False, indent=2))
            sys.exit(1)

        if not query:
            print(json.dumps({
                "status": "error",
                "message": "缺少必需参数: query（搜索查询语句）",
                "required_params": ["query"],
                "examples": [
                    'app="Apache"',
                    'title="登录"',
                    'domain="example.com"',
                    'ip="1.1.1.1"',
                    'port="80"',
                    'country="CN"',
                    'city="Beijing"'
                ]
            }, ensure_ascii=False, indent=2))
            sys.exit(1)

        # 代理侧常见不支持的高阶语法提示（不拦截，仅在失败时附带）
        proxy_syntax_hints = []
        if is_proxy_endpoint(base_url):
            for token, tip in (
                ('*=', '模糊匹配 *='),
                ('after=', '时间 after'),
                ('before=', '时间 before'),
                ('port_size', 'port_size'),
                ('fid=', 'fid'),
            ):
                if token in query:
                    proxy_syntax_hints.append(tip)

        params_base = {
            'qbase64': base64.b64encode(query.encode('utf-8')).decode('utf-8')
        }
        if 'size' in config and config['size'] is not None:
            try:
                size = int(config['size'])
                if size > 0:
                    params_base['size'] = size
            except (ValueError, TypeError):
                pass
        if 'page' in config and config['page'] is not None:
            try:
                page = int(config['page'])
                if page > 0:
                    params_base['page'] = page
            except (ValueError, TypeError):
                pass
        if config.get('fields'):
            params_base['fields'] = str(config.get('fields')).strip()
        if 'full' in config and config['full'] is not None:
            full_val = config['full']
            if isinstance(full_val, bool):
                params_base['full'] = 'true' if full_val else 'false'
            elif isinstance(full_val, str):
                params_base['full'] = 'true' if full_val.lower() in ('true', '1', 'yes') else 'false'
            elif isinstance(full_val, (int, float)):
                params_base['full'] = 'true' if full_val != 0 else 'false'

        candidates = build_candidate_urls(base_url, fallback_urls)
        attempts = []
        last_err = None

        for url in candidates:
            for mode in auth_modes_to_try():
                if mode == 'key' and not api_key:
                    continue
                if mode == 'bearer' and not bearer_token:
                    continue
                for verify in verify_modes_for(url):
                    params = dict(params_base)
                    headers = default_headers(url, use_bearer=(mode == 'bearer'))
                    if mode == 'key':
                        params['key'] = api_key
                        if email:
                            params['email'] = email
                    else:
                        headers['Authorization'] = 'Bearer ' + bearer_token
                        # 部分代理 Bearer 仍接受 key；有则附带提高兼容
                        if api_key:
                            params['key'] = api_key
                    try:
                        sess = make_session(verify)
                        resp = sess.get(url, params=params, headers=headers, timeout=timeout_sec, allow_redirects=True)
                        # 重定向到 https 后若仍失败会在 except
                        text_head = (resp.text or '')[:300]
                        if resp.status_code >= 400:
                            attempts.append({
                                "url": url, "auth": mode, "verify_ssl": verify,
                                "http_status": resp.status_code, "body": text_head
                            })
                            last_err = f"HTTP {resp.status_code}: {text_head}"
                            continue
                        try:
                            result_data = resp.json()
                        except Exception as je:
                            attempts.append({
                                "url": url, "auth": mode, "verify_ssl": verify,
                                "http_status": resp.status_code, "error": f"非JSON响应: {je}",
                                "body": text_head
                            })
                            last_err = f"非JSON响应: {text_head}"
                            continue
                        if result_data.get('error'):
                            errmsg = result_data.get('errmsg', '未知错误')
                            attempts.append({
                                "url": url, "auth": mode, "verify_ssl": verify,
                                "api_error": errmsg
                            })
                            last_err = f"FOFA API错误: {errmsg}"
                            # 账号无效等业务错误：换 auth/url 继续，不立刻退出
                            continue

                        output = {
                            "status": "success",
                            "query": query,
                            "size": result_data.get('size', 0),
                            "page": result_data.get('page', 1),
                            "total": result_data.get('total', 0),
                            "results_count": len(result_data.get('results', [])),
                            "results": result_data.get('results', []),
                            "message": f"成功获取 {len(result_data.get('results', []))} 条结果",
                            "endpoint": url,
                            "auth_mode_used": mode,
                            "verify_ssl": verify,
                        }
                        if proxy_syntax_hints:
                            output["proxy_syntax_note"] = (
                                "当前为第三方代理端点，部分官方高级语法可能不支持: "
                                + ", ".join(proxy_syntax_hints)
                            )
                        print(json.dumps(output, ensure_ascii=False, indent=2))
                        sys.exit(0)
                    except requests.exceptions.SSLError as e:
                        attempts.append({
                            "url": url, "auth": mode, "verify_ssl": verify,
                            "error": f"SSLError: {e}"
                        })
                        last_err = f"TLS失败: {e}"
                        continue
                    except requests.exceptions.RequestException as e:
                        attempts.append({
                            "url": url, "auth": mode, "verify_ssl": verify,
                            "error": str(e)
                        })
                        last_err = str(e)
                        continue

        suggestion = [
            "1) 确认 fofa.base_url 为当前服务实际 search 接口，且与 api_key 属于同一服务方",
            "2) TLS 异常时设置 fofa.verify_ssl: false 或环境变量 FOFA_VERIFY_SSL=false",
            "3) 需要时配置 fofa.fallback_base_urls 备用地址",
            "4) 若接口使用 Bearer，配置 fofa.bearer_token 与 auth_mode",
            "5) 部分兼容接口可能不支持官方全部高级语法，请简化 query 后重试",
        ]
        print(json.dumps({
            "status": "error",
            "message": f"请求失败: {last_err or '所有端点均不可用'}",
            "base_url": base_url,
            "fallback_base_urls": fallback_urls,
            "auth_mode": auth_mode,
            "attempts": attempts[-12:],
            "suggestion": "\n".join(suggestion),
            "proxy_syntax_hints": proxy_syntax_hints or None,
        }, ensure_ascii=False, indent=2))
        sys.exit(1)

    except Exception as e:
        print(json.dumps({
            "status": "error",
            "message": f"执行出错: {str(e)}",
            "type": type(e).__name__
        }, ensure_ascii=False, indent=2))
        sys.exit(1)
enabled: true
short_description: "FOFA 及兼容 search 接口资产搜索（TLS 降级、备用地址、key/Bearer）"
description: |
  调用配置中的 FOFA 兼容 search 接口做资产检索（端点与密钥均来自配置/环境变量，无内置第三方地址）。

  **配置（config.yaml → fofa，勿把密钥写进工具参数）：**
  - base_url: search 接口完整 URL（留空默认官方）
  - api_key / email: 鉴权
  - bearer_token / auth_mode: 可选 Bearer
  - verify_ssl / fallback_base_urls / timeout_seconds: 连通性

  **工具参数：** query（必填）、size、page、fields、full
parameters:
  type: object
  properties:
    query:
      type: string
      description: "FOFA 查询语句，如 domain=\"example.com\""
    size:
      type: number
      description: "每页条数，默认由账户/代理限制"
    page:
      type: number
      description: "页码，从 1 开始"
    fields:
      type: string
      description: "返回字段，逗号分隔，如 host,ip,port,title,protocol"
    full:
      type: boolean
      description: "是否 full 模式（部分代理可能忽略）"
  required:
    - query
