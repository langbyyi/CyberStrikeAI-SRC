name: recon-ng
command: recon-ng
enabled: true
short_description: OSINT 侦察框架（模块化信息收集）
description: '模块化 OSINT 侦察框架，含域名、联系人、凭据泄露等模块。

  **使用场景：** 综合信息收集、自动化侦察。


  **安装：** `apt install recon-ng`（若不可用先安装）。'
parameters:
  - name: workspace
    type: string
    required: false
    flag: -w
    format: flag
    description: 工作区名称
  - name: resource
    type: string
    required: false
    flag: -r
    format: flag
    description: resource 脚本文件（含模块命令）
  - name: no_check
    type: bool
    required: false
    flag: -n
    format: flag
    default: false
    description: 跳过模块更新检查
  - name: additional_args
    type: string
    required: false
    format: positional
    description: 额外参数，如 `-c 'marketplace search x'`(执行命令)
