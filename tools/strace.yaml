name: strace
command: strace
enabled: true
short_description: 系统调用追踪（二进制动态分析）
description: '追踪进程的系统调用与信号。

  **使用场景：** 二进制动态分析、文件/网络行为审计。


  **安装：** `apt install strace`（若不可用先安装）。'
parameters:
  - name: command
    type: string
    required: true
    position: 0
    format: positional
    description: 要追踪的命令，如 `./binary arg1`
  - name: trace
    type: string
    required: false
    flag: -e
    format: flag
    description: 追踪特定系统调用，如 `-e trace=open,read`
  - name: output
    type: string
    required: false
    flag: -o
    format: flag
    description: 输出文件
  - name: additional_args
    type: string
    required: false
    format: positional
    description: 额外参数，如 `-f`(跟踪子进程) `-v`(详细) `-c`(统计)
