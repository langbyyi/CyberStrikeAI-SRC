name: chisel
command: chisel
enabled: true
short_description: 内网隧道/端口转发（HTTP/SSH 隧道）
description: '内网穿透与端口转发工具，基于 TCP/HTTP 隧道。

  **使用场景：** 内网横向移动、端口转发、绕过出网限制。


  **安装：** `go install github.com/jpillora/chisel@latest` 或下载 release（若不可用先安装）。'
parameters:
  - name: mode
    type: string
    required: true
    position: 0
    format: positional
    options:
      - client
      - server
    description: client(客户端)/server(服务端)
  - name: server
    type: string
    required: false
    position: 1
    format: positional
    description: 'client 模式：chisel 服务端地址（单段，如 `1.2.3.4:8080`）。

      server 模式：省略。'
  - name: additional_args
    type: string
    required: false
    format: positional
    description: '空格分隔的附加参数。

      client 模式：隧道映射（位于 server 地址之后），如 `R:8000:10.0.0.1:80` `8001:10.0.0.2:80`。

      server 模式：启动选项，如 `-p 8080 --reverse`。

      注意 client 的连接选项（--port 等）必须置于 server 地址之前，本参数在命令末尾，
      此类复杂场景建议改用 exec 直接拼命令。'
