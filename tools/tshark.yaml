name: tshark
command: tshark
enabled: true
short_description: Wireshark 命令行流量分析
description: 'Wireshark 命令行版本，支持抓包与 pcap 分析。

  **使用场景：** 流量深度分析、协议解码、凭据提取。


  **安装：** `apt install tshark`（若不可用先安装）。'
parameters:
  - name: filter
    type: string
    required: false
    flag: -f
    format: flag
    description: 抓包过滤，如 `tcp port 80`
  - name: read_file
    type: string
    required: false
    flag: -r
    format: flag
    description: 读取 pcap 文件
  - name: additional_args
    type: string
    required: false
    format: positional
    description: '额外参数（空格分隔，引号内保持整段）。

      字段提取：`-T fields -e ip.src -e http.host`（多个 -e 逐一列出）；

      显示过滤：`-Y ''http.request''`；抓包数量 `-c 100`；协议解码 `-V`'
