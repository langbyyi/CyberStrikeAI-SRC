name: "exec"
command: "sh"
args: ["-c"]
enabled: true
# 简短描述（用于工具列表，减少token消耗）
short_description: "系统命令执行工具，用于执行Shell命令和系统操作（谨慎使用）"
# 工具详细描述
description: |
  系统命令执行工具，用于执行Shell命令和系统操作。

  **主要功能：**
  - 执行任意Shell命令
  - 支持bash、sh等shell
  - 可以指定工作目录
  - 返回命令执行结果

  **使用场景：**
  - 系统管理和维护
  - 自动化脚本执行
  - 文件操作和处理
  - 系统信息收集

  **安全警告：**
  - ⚠️ 此工具可以执行任意系统命令，存在安全风险
  - ⚠️ 仅应在受控环境中使用
  - ⚠️ 所有命令执行都会被记录
  - ⚠️ 建议限制可执行的命令范围
  - ⚠️ 不要执行不可信的命令
# 参数定义
parameters:
  - name: "command"
    type: "string"
    description: |
      要执行的系统命令。可以是任何有效的Shell命令。

      **格式要求：**
      - 完整的Shell命令
      - 可以包含管道、重定向等Shell特性
      - 支持环境变量

      **示例值：**
      - 简单命令: "ls -la"
      - 带管道: "ps aux | grep nginx"
      - 文件操作: "cat /etc/passwd"
      - 网络命令: "curl http://example.com"
      - 系统信息: "uname -a"
      - 查找文件: "find /var/log -name '*.log'"

      **注意事项：**
      - 命令会在指定的shell中执行
      - 确保命令语法正确
      - 注意命令的安全影响
      - 必需参数，不能为空
    required: true
    position: 0
    format: "positional"
  - name: "shell"
    type: "string"
    description: |
      使用的Shell类型，默认为sh。

      **可选值：**
      - sh: 标准Shell（默认）
      - bash: Bash Shell
      - zsh: Z Shell
      - 其他系统可用的shell

      **示例值：**
      - "sh" (默认)
      - "bash"
      - "zsh"

      **注意事项：**
      - 确保指定的shell在系统中可用
      - 不同shell的命令语法可能略有差异
    required: false
    default: "sh"
  - name: "workdir"
    type: "string"
    description: |
      命令执行的工作目录。如果不指定，使用当前工作目录。

      **格式要求：**
      - 绝对路径或相对路径
      - 目录必须存在

      **示例值：**
      - "/tmp"
      - "/var/log"
      - "./data"
      - "/home/user/project"

      **注意事项：**
      - 确保目录存在且有访问权限
      - 相对路径相对于程序运行目录
    required: false
  - name: "additional_args"
    type: "string"
    description: |
      额外的exec参数。用于传递未在参数列表中定义的exec选项。

      **示例值：**
      - 根据工具特性添加常用参数示例

      **注意事项：**
      - 多个参数用空格分隔
      - 确保参数格式正确，避免命令注入
      - 此参数会直接追加到命令末尾
    required: false
    format: "positional"
  - name: "confirmed"
    type: "string"
    description: |
      用户已确认的具体敏感接口 URL。当系统检测到命令包含敏感接口的写操作时，会拦截并提示你向用户报告。
      用户明确同意后，将此参数设为用户同意的具体 URL（如 "http://192.168.1.1/api/delete"），系统会校验该 URL 是否在命令中。
      不同接口/不同目标需要分别授权，每次敏感操作都需要独立的用户确认。
      未被拦截的普通命令无需设置此参数。
    required: false
    default: ""
